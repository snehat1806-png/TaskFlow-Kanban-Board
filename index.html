<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="kanban-header">
    <h1 class="kanban-name">TaskFlow</h1>
    <form class="add-task-form">
      <input class="add-task-input" type="text" placeholder="Add a new task">
      <select class="add-task-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button class="add-task-button" type="submit">Add task</button>
    </form>
  </header>

  <main class="board">
    <section class="column" data-status="todo">
      <h2 class="column-title">To Do <span class="task-count">(0)</span></h2>
      <div class="task-list"></div>
    </section>

    <section class="column" data-status="doing">
      <h2 class="column-title">In Progress <span class="task-count">(0)</span></h2>
      <div class="task-list"></div>
    </section>

    <section class="column" data-status="done">
      <h2 class="column-title">Done <span class="task-count">(0)</span></h2>
      <div class="task-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
